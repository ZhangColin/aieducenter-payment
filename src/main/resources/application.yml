server:
  port: 18081

spring:
  application:
    name: aieducenter-payment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: aieducenter-payment_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# OpenAPI 签名配置
# payment 是 openapi provider（校验入站签名）：凭据源为 app-registry 的 bootstrap 端点
# （@NoSignature、内网-only，ADR-0002）：
#   GET {APP_REGISTRY_BASE_URL}/api/app-registry/api-keys/{apiKey} → ApiKeyInfo（含明文 apiSecret）
# 字面 {apiKey} 段为占位符，由框架 RemoteApiKeyProvider 用调用方 X-Api-Key 的值替换。
#
# self.* 为 payment 自身的出站签名凭据（预留）：当前代码尚未消费，待 caller 能力
# （如 BusinessSystemNotifier 出站通知签名）落地后启用；届时须同步修订 CONTEXT.md
# 不变式 1，并在 app-registry 登记 payment 的 caller 凭据。生产须以环境变量注入真实值，勿硬编码。
cartisan:
  openapi:
    apikey-service-url: ${APP_REGISTRY_BASE_URL:http://localhost:8088}/api/app-registry/api-keys/{apiKey}
    self:
      api-key: ${PAYMENT_API_KEY:payment}
      api-secret: ${PAYMENT_API_SECRET:dev-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
