# 建行惠市宝支付配置
hsb:
  base-url: ${HSB_BASE_URL:http://marketpaypl4.dev.jh:8035/online/direct/}
  mkt-id: ${HSB_MKT_ID:41060860811052}
  private-key: ${HSB_PRIVATE_KEY:}
  platform-public-key: ${HSB_PLATFORM_PUBLIC_KEY:}
