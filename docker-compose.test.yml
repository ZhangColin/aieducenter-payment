services:
  app:
    build: .
    container_name: aieducenter-payment
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env.test
    environment:
      - SPRING_PROFILES_ACTIVE=test
    extra_hosts:
      - "marketpaypl4.dev.jh:42.240.3.133"
#    networks:
#      - webnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

